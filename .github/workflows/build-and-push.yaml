name: "Build and Push"

on:
  push:
    branches: [ develop-20250812 ]
  pull_request:
    branches: [develop-20250812]
  workflow_dispatch: ~

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v3
        with:
          go-version: 1.19
    # There are too many lint errors in current code bases
    # uncomment when we decide what lint should be addressed or ignored.
    # - run: make lint
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: "Checkout ${{ github.ref }}"
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: "Setup Go"
        uses: actions/setup-go@v3
        with:
          go-version: 1.19

      - name: Setup Golang Caches
        uses: actions/cache@v3
        with:
          path: |-
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-go

      - run: git stash # restore patch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker
        run: |
           docker login -u inspurwyd  -p  dckr_pat_yMRt21vCZj0PlDl14xJiqSOHeVg

      - name: Build and push multi-arch image
        run: |
          docker buildx build --no-cache  --platform linux/amd64  -f Dockerfile -t  inspurwyd/higress-operator:latest  --push .
